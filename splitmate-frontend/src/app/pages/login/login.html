
<div class="login-page">

  <div class="login-card">

    <div class="brand">
      <div class="brand-icon">S</div>
      <h1>SplitMate</h1>
    </div>

    <div class="welcome">
      <h2>Welcome back!</h2>
      <p>Manage your expenses. Split smarter. Stay connected.</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onLogin()">

      <div class="form-group">
        <label>Email address</label>

        <input
          type="email"
          placeholder="Enter your email"
          formControlName="email"
        />

        <small class="error"
          *ngIf="f['email'].touched && f['email'].errors?.['required']">
          Email is required.
        </small>

        <small class="error"
          *ngIf="f['email'].touched && f['email'].errors?.['email']">
          Enter a valid email address.
        </small>
      </div>

      <div class="form-group">
        <label>Password</label>

        <div class="password-wrapper">
          <input
            [type]="showPassword ? 'text' : 'password'"
            placeholder="Enter your password"
            formControlName="password"
          />

          <button
            type="button"
            class="show-password"
            (click)="togglePassword()">
            {{ showPassword ? 'Hide' : 'Show' }}
          </button>
        </div>

        <small class="error"
          *ngIf="f['password'].touched && f['password'].errors?.['required']">
          Password is required.
        </small>

        <small class="error"
          *ngIf="f['password'].touched && f['password'].errors?.['minlength']">
          Password must contain at least 6 characters.
        </small>
      </div>

      <div class="form-options">
        <label class="remember">
          <input type="checkbox" formControlName="rememberMe" />
          Remember me
        </label>

        <a routerLink="/forgot-password">Forgot password?</a>
      </div>

      <button type="submit" class="login-button">
        Sign In
      </button>

    </form>

    <div class="signup">
      Don't have an account?
      <a routerLink="/register">Create account</a>
    </div>

    <div class="footer">
      © 2026 SplitMate. Made for sharing.
    </div>

  </div>

</div>
